name: fetch-scentlab
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          while read slug url; do
            [ -z "$slug" ] && continue
            curl -sSL -A "Mozilla/5.0" -o "img/$slug.webp" "$url" || echo "FAIL $slug"
          done < urls.txt
          ls -la img
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git rm -q .github/workflows/fetch.yml
          git add img
          git commit -m "SCENTLAB images"
          git push
